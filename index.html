<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Damier</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1c1f26;
        color: #f4f4f4;
      }

      main {
        width: min(92vw, 760px);
        padding: 24px;
      }

      .layout {
        display: grid;
        gap: 20px;
      }

      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .status {
        font-size: 1.05rem;
        font-weight: 600;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: #f2c14e;
        color: #1c1f26;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        width: min(92vw, 640px);
        aspect-ratio: 1;
        border: 8px solid #7a5230;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      }

      .square {
        position: relative;
        display: grid;
        place-items: center;
      }

      .square.light {
        background: #eed9b7;
      }

      .square.dark {
        background: #6b4b2a;
      }

      .square.selectable {
        outline: 4px solid rgba(255, 215, 0, 0.45);
        outline-offset: -4px;
      }

      .square.selected {
        outline: 4px solid #00d1ff;
        outline-offset: -4px;
      }

      .square.move-target::after {
        content: "";
        width: 24%;
        height: 24%;
        border-radius: 50%;
        background: rgba(0, 209, 255, 0.95);
      }

      .piece {
        width: 72%;
        height: 72%;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 3px solid rgba(255, 255, 255, 0.28);
        box-sizing: border-box;
      }

      .piece.red {
        background: #d1495b;
      }

      .piece.black {
        background: #222;
      }

      .piece.king::before {
        content: "♛";
        font-size: clamp(18px, 3vw, 28px);
        color: #ffe08a;
      }

      .legend {
        font-size: 0.95rem;
        color: #d9d9d9;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <div class="panel">
          <div class="status" id="status">Red to move</div>
          <button type="button" id="restart">Restart game</button>
        </div>
        <div class="legend">Select a highlighted piece, then choose a valid destination.</div>
        <div class="board" id="board" aria-label="Damier board"></div>
      </div>
    </main>

    <script>
      const boardSize = 8;
      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      const restartButton = document.getElementById("restart");

      let board = [];
      let currentPlayer = "red";
      let selectedPiece = null;
      let currentMoves = [];
      let winner = null;

      const directions = {
        red: [[-1, -1], [-1, 1]],
        black: [[1, -1], [1, 1]],
      };

      function createInitialBoard() {
        return Array.from({ length: boardSize }, (_, row) =>
          Array.from({ length: boardSize }, (_, col) => {
            if ((row + col) % 2 === 0) {
              return null;
            }

            if (row < 3) {
              return { player: "black", king: false };
            }

            if (row > 4) {
              return { player: "red", king: false };
            }

            return null;
          })
        );
      }

      function isInside(row, col) {
        return row >= 0 && row < boardSize && col >= 0 && col < boardSize;
      }

      function getMoveDirections(piece) {
        return piece.king ? [...directions.red, ...directions.black] : directions[piece.player];
      }

      function getMovesForPiece(row, col, enforceCaptureOnly = false) {
        const piece = board[row][col];
        if (!piece) {
          return [];
        }

        const moves = [];

        for (const [rowDelta, colDelta] of getMoveDirections(piece)) {
          const nextRow = row + rowDelta;
          const nextCol = col + colDelta;

          if (isInside(nextRow, nextCol) && !board[nextRow][nextCol] && !enforceCaptureOnly) {
            moves.push({ row: nextRow, col: nextCol, capture: null });
          }

          const jumpRow = row + rowDelta * 2;
          const jumpCol = col + colDelta * 2;
          if (!isInside(jumpRow, jumpCol) || board[jumpRow][jumpCol]) {
            continue;
          }

          const jumpedPiece = isInside(nextRow, nextCol) ? board[nextRow][nextCol] : null;
          if (jumpedPiece && jumpedPiece.player !== piece.player) {
            moves.push({
              row: jumpRow,
              col: jumpCol,
              capture: { row: nextRow, col: nextCol },
            });
          }
        }

        return enforceCaptureOnly ? moves.filter((move) => move.capture) : moves;
      }

      function playerHasCapture(player) {
        for (let row = 0; row < boardSize; row += 1) {
          for (let col = 0; col < boardSize; col += 1) {
            const piece = board[row][col];
            if (piece && piece.player === player && getMovesForPiece(row, col, true).length) {
              return true;
            }
          }
        }

        return false;
      }

      function hasAnyMove(player) {
        for (let row = 0; row < boardSize; row += 1) {
          for (let col = 0; col < boardSize; col += 1) {
            const piece = board[row][col];
            if (piece && piece.player === player && getMovesForPiece(row, col, playerHasCapture(player)).length) {
              return true;
            }
          }
        }

        return false;
      }

      function selectablePiecesForPlayer(player) {
        const captureRequired = playerHasCapture(player);
        const selectable = new Set();

        for (let row = 0; row < boardSize; row += 1) {
          for (let col = 0; col < boardSize; col += 1) {
            const piece = board[row][col];
            if (!piece || piece.player !== player) {
              continue;
            }

            if (getMovesForPiece(row, col, captureRequired).length) {
              selectable.add(`${row}-${col}`);
            }
          }
        }

        return selectable;
      }

      function crownIfNeeded(piece, row) {
        if (piece.king) {
          return;
        }

        if ((piece.player === "red" && row === 0) || (piece.player === "black" && row === boardSize - 1)) {
          piece.king = true;
        }
      }

      function switchTurn() {
        currentPlayer = currentPlayer === "red" ? "black" : "red";
        selectedPiece = null;
        currentMoves = [];

        if (!hasAnyMove(currentPlayer)) {
          winner = currentPlayer === "red" ? "Black" : "Red";
        }
      }

      function updateStatus() {
        if (winner) {
          statusElement.textContent = `${winner} wins!`;
          return;
        }

        const captureRequired = playerHasCapture(currentPlayer);
        const playerName = currentPlayer === "red" ? "Red" : "Black";
        statusElement.textContent = captureRequired ? `${playerName} to move — capture required` : `${playerName} to move`;
      }

      function renderBoard() {
        const selectable = selectablePiecesForPlayer(currentPlayer);
        boardElement.innerHTML = "";

        for (let row = 0; row < boardSize; row += 1) {
          for (let col = 0; col < boardSize; col += 1) {
            const square = document.createElement("button");
            square.type = "button";
            square.className = `square ${(row + col) % 2 === 0 ? "light" : "dark"}`;
            square.dataset.row = row;
            square.dataset.col = col;
            square.setAttribute("aria-label", `Row ${row + 1} Column ${col + 1}`);

            if (selectable.has(`${row}-${col}`) && !winner) {
              square.classList.add("selectable");
            }

            if (selectedPiece && selectedPiece.row === row && selectedPiece.col === col) {
              square.classList.add("selected");
            }

            if (currentMoves.some((move) => move.row === row && move.col === col)) {
              square.classList.add("move-target");
            }

            const piece = board[row][col];
            if (piece) {
              const pieceElement = document.createElement("div");
              pieceElement.className = `piece ${piece.player}${piece.king ? " king" : ""}`;
              square.appendChild(pieceElement);
            }

            square.addEventListener("click", () => onSquareClick(row, col));
            boardElement.appendChild(square);
          }
        }

        updateStatus();
      }

      function moveSelectedPiece(targetRow, targetCol) {
        const move = currentMoves.find((candidate) => candidate.row === targetRow && candidate.col === targetCol);
        if (!move || !selectedPiece) {
          return;
        }

        const piece = board[selectedPiece.row][selectedPiece.col];
        board[selectedPiece.row][selectedPiece.col] = null;
        board[targetRow][targetCol] = piece;

        if (move.capture) {
          board[move.capture.row][move.capture.col] = null;
        }

        crownIfNeeded(piece, targetRow);

        if (move.capture) {
          selectedPiece = { row: targetRow, col: targetCol };
          currentMoves = getMovesForPiece(targetRow, targetCol, true);
          if (currentMoves.length) {
            renderBoard();
            return;
          }
        }

        switchTurn();
        renderBoard();
      }

      function onSquareClick(row, col) {
        if (winner) {
          return;
        }

        const piece = board[row][col];

        if (selectedPiece && currentMoves.some((move) => move.row === row && move.col === col)) {
          moveSelectedPiece(row, col);
          return;
        }

        if (!piece || piece.player !== currentPlayer) {
          selectedPiece = null;
          currentMoves = [];
          renderBoard();
          return;
        }

        const captureRequired = playerHasCapture(currentPlayer);
        const moves = getMovesForPiece(row, col, captureRequired);
        if (!moves.length) {
          return;
        }

        selectedPiece = { row, col };
        currentMoves = moves;
        renderBoard();
      }

      function resetGame() {
        board = createInitialBoard();
        currentPlayer = "red";
        selectedPiece = null;
        currentMoves = [];
        winner = null;
        renderBoard();
      }

      restartButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
